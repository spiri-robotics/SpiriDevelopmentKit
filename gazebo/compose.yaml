# gazebo: a Gazebo Jetty world. Gazebo talks gz-transport over zenoh, through
# the zenoh-router app on the `spirisynq` network, so robots (and a
# developer's native `gz sim -g`) reach it by partition, not by address.
# Install zenoh-router first. To see the world, install debug-map.
#
# Optional: robots fly without it, they just have no world to spawn into.
x-spiri-settings:
  - env: GZ_WORLD
    widget: select
    label: World
    help: >-
      The world to load. Robots spawn into whichever world is up, and take
      their GPS home from its location. citadel-hill is the Halifax Citadel,
      hill and buildings; the others are flat ground: yarmouth-airport in Nova
      Scotia, and cmac, ArduPilot's stock SITL field in Canberra.
    options: [citadel-hill, yarmouth-airport, cmac]
    default: citadel-hill

services:
  gazebo:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo:edge
    restart: unless-stopped
    # gz-watchdog stops Gazebo when its link to the router drops, for the
    # restart policy to bring back; see gz/gz-watchdog.py.
    command: ["gz-watchdog", "gz", "sim", "-s", "-r", "-v", "3", "--headless-rendering", "/worlds/${GZ_WORLD:-citadel-hill}.sdf"]
    # Render cameras on the host's GPU. In software, every camera frame
    # stalls the lock-stepped sim (real-time factor ~0.1). A bind mount, not
    # `devices:`, so a host without /dev/dri still starts, in software.
    volumes:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 226:* rmw"
    networks:
      - spirisynq

  # Same image, serving the world's model and world files over HTTP.
  # debug-map reads meshes from here, and robots read the world's location
  # (/world.sdf). See gz/asset_server.py.
  gazebo-assets:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo:edge
    restart: unless-stopped
    command: ["python3", "/usr/local/bin/gz-asset-server"]
    environment:
      GZ_WORLD: ${GZ_WORLD:-citadel-hill}
    networks:
      - spirisynq

networks:
  spirisynq:
    name: spirisynq
    external: true
