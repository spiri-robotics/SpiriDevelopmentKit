# spirimav: the robot as a SpiriSynq object, installed inside a sim-robot. It
# is SpiriMav, the same app a real Mu runs: a secondary GCS on the flight
# controller's MAVLink that publishes the robot's state, and its place in the
# frame tree (origin, home, gimbals, ROI), and takes commands as RPCs. Here
# until there's an Appsource-Spiri-Mu for it.
#
# Its MAVLink is mavlink-router's tcp 5760, in the robot's own network
# namespace, which it reaches as host.docker.internal from `spirisynq`: a
# zenoh app stays off the host network, where only zenoh-router-host may be.
# mavlink-router sends it all traffic (SnifferSysid) so it sees the ROIs
# QGroundControl sets; its sysid, 254, has to match that setting. Install
# zenoh-router and mavlink-router first.
#
# To run a SpiriMav you built yourself, load its image into the robot and tag
# it as this one:
#
#   docker save ghcr.io/spiri-robotics/spirimav:edge | docker exec -i mu-1 docker load
services:
  spirimav:
    image: ghcr.io/spiri-robotics/spirimav:edge
    restart: unless-stopped
    networks:
      - spirisynq
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # The robot's, from the environment of its SpiriConfig: its name, which
      # its topics are under, and its flight controller's system ID.
      SPIRI_SYNQ_BASE_TOPIC: ${ROBOT_NAME:-mu-1}
      SPIRI_MAV_TARGET_SYSID: ${ROBOT_SYSID:-1}
      SPIRI_MAV_MAVLINK_URL: tcp:host.docker.internal:5760
      SPIRI_MAV_SYSID: "254"
      # Gimbal 1 carries the robot's first camera (sim-camera-ingress).
      SPIRI_MAV_GIMBAL_CAMERAS: '{"1": ["${ROBOT_NAME:-mu-1}/camera1"]}'

networks:
  spirisynq:
    name: spirisynq
    external: true
