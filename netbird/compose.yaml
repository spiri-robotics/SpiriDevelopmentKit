# netbird: puts the robot on its organization's NetBird VPN, as configured by
# its Spiri Cloud link. Install cloud-link too; without a link this stays off.
# Like cloud-link, nothing about it is simulated, and it's here until there's
# an Appsource-Spiri-Mu for it.
#
# It watches cloud-link's env file rather than reading it through env_file,
# so linking and unlinking take effect within seconds, without a restart.
# Unlinking deletes the robot's peer in the cloud, and this takes the tunnel
# down. Joining the VPN grants nothing by itself: each cloud service still
# checks the robot's own access.
#
# Host networking puts the VPN interface (wt0) in the robot's own network, so
# the organization's peers reach the robot itself, at its NetBird address.
services:
  netbird:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/netbird:edge
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    volumes:
      # The peer's WireGuard key and NetBird's state.
      - netbird:/var/lib/netbird
      - /var/lib/spiri-cloud:/spiri-cloud:ro

volumes:
  netbird:
