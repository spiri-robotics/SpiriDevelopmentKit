# ardupilot-sitl: the flight controller of a simulated Mu, installed inside a
# sim-robot. Stands in for the FC board; everything that talks MAVLink to it
# talks to it the same way. Install sim-agent too, which puts the robot's
# airframe into the world for SITL to fly.
#
# Runs in the robot's own network namespace, which sits on the appliance
# network: it reaches the world by name, and QGroundControl reaches it at the
# robot's address on tcp 5760, which sim-robot publishes.
services:
  sitl:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/ardupilot-sitl:edge
    restart: unless-stopped
    network_mode: host
    environment:
      # The robot's, from the environment of its SpiriConfig.
      ROBOT_SYSID: ${ROBOT_SYSID:-1}
      # Empty: the world's <spherical_coordinates>, read from gazebo-assets.
      # Set as lat,lon,alt,heading only to fly somewhere the world isn't.
      SITL_HOME: ${SITL_HOME:-}
    volumes:
      - ardupilot:/var/lib/ardupilot

volumes:
  ardupilot:
