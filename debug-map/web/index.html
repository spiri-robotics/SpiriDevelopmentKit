<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gazebo</title>
    <script>
      // Cesium loads its workers and assets from here. Relative, so it works
      // behind SpiriConfig's /plugin/<name>/ prefix.
      window.CESIUM_BASE_URL = new URL("cesium/", window.location.href).href;
    </script>
  </head>
  <body>
    <!-- The applet list; shell.js fills #applets. -->
    <aside id="sidebar">
      <div id="brand">
        <span id="brand-name">Map</span>
        <button id="sidebar-toggle" type="button" title="Hide sidebar (/ or Ctrl+K brings it back)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6" /></svg>
        </button>
      </div>
      <div id="filters">
        <input id="search" type="search" placeholder="Search applets…" aria-label="Search applets"
               aria-controls="applets" autocomplete="off" spellcheck="false" title="Search applets (/ or Ctrl+K)" />
      </div>
      <nav id="applets" aria-label="Applets"></nav>
      <div id="sidebar-foot">
        <span id="status" class="down">connecting…</span>
      </div>
    </aside>
    <main id="stage">
      <div id="map"></div>
      <!-- Gazebo's 3D world, drawn over the globe; see gz-overlay.js. -->
      <canvas id="gz"></canvas>
      <button id="sidebar-expand" type="button" title="Show sidebar (/ or Ctrl+K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
