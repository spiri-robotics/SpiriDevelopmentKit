# The robot's MAVLink: one flight controller, any number of clients.

[General]
# QGroundControl (through sim-robot's published port) and the robot's own
# apps, such as SpiriMav, all connect here. Each TCP client is its own link,
# and the router forwards between them as well as to and from the FC.
TcpServerPort=5760
ReportStats=false
# Not warning: it reports, every 5 s, messages for systems that aren't
# connected, such as the FC's to QGroundControl before QGC has connected.
DebugLogLevel=error
# SpiriMav's sysid: whichever link it's on gets all traffic, not just what's
# addressed to it, so it sees the ROI commands QGroundControl sends the FC and
# shows them in the frame tree. It only reads them.
SnifferSysid=254

# The flight controller. On a real Mu this is its UART; in the sim it's
# ardupilot-sitl, whose serial0 sends here and is answered at the address it
# sends from.
[UdpEndpoint fc]
Mode=Server
Address=127.0.0.1
Port=14560
