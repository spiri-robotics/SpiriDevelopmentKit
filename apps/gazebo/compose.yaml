# gazebo: a Gazebo Jetty world plus a Cesium map viewer for SpiriConfig.
# Gazebo talks gz-transport over zenoh, through the zenoh-router app on the
# `spirisynq` network, so robots (and a developer's native `gz sim -g`) reach
# it by partition, not by address. Install zenoh-router first.
#
# Optional: robots fly without it, they just have no world to spawn into.
services:
  gazebo:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo:0.1.2
    restart: unless-stopped
    networks:
      - spirisynq

  # Same image, serving model and world files over HTTP; the map reads the
  # world's georeference from here. See gz/asset_server.py.
  gazebo-assets:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo:0.1.2
    restart: unless-stopped
    command: ["python3", "/usr/local/bin/gz-asset-server"]
    networks:
      - spirisynq

  # Same image, bridging the page's zenoh-ts websocket onto the router as a
  # zenoh client. It is the page's whole view of zenoh: anything that can
  # reach the page can read and write every key through it.
  zenoh-ws:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo-web:0.1.2
    restart: unless-stopped
    command:
      - zenoh-bridge-remote-api
      - --mode=client
      - --connect=tcp/zenoh-router:7447
      - --no-multicast-scouting
      - --ws-port=10000
    networks:
      - spirisynq

  # Everything on zenoh, summarised for the page: it subscribes to `**` here,
  # next to the router, so big streams never reach browsers that aren't
  # looking at them. See index/index.py.
  zenoh-index:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/zenoh-index:edge
    restart: unless-stopped
    networks:
      - spirisynq

  gazebo-web:
    image: ghcr.io/spiri-robotics/spiridevelopmentkit/gazebo-web:0.1.2
    restart: unless-stopped
    environment:
      GZ_WEBSOCKET: gazebo:9002
      GZ_ASSETS: gazebo-assets:9003
      ZENOH_WS: zenoh-ws:10000
    depends_on:
      - gazebo
      - gazebo-assets
      - zenoh-ws
    networks:
      - spirisynq
    labels:
      spiriconfig.plugin.name: gazebo
      spiriconfig.plugin.port: "8080"
      spiriconfig.plugin.title: Gazebo
      spiriconfig.plugin.icon: view_in_ar

networks:
  spirisynq:
    name: spirisynq
    external: true
